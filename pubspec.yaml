name: iptv_flutter
description: A provider-independent IPTV browser and player.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path_provider: ^2.1.6
  ffmpeg_kit_flutter_new_https: ^2.6.7
dev_dependencies:
  integration_test:
    sdk: flutter
  test: ^1.26.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/avatars/photos/
