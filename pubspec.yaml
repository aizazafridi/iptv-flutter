name: iptv_flutter
description: A provider-independent IPTV browser and player.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path_provider: ^2.1.6
  ffmpeg_kit_flutter_new_https: ^2.6.7
  cached_network_image: ^4.0.5
  flutter_cache_manager: ^3.4.5
  crypto: ^3.0.7
  http: ^1.6.0
  url_launcher: ^6.3.3
  flutter_inappwebview: ^6.1.5
  qr_flutter: ^4.1.0
  flutter_svg: ^2.3.0
# The upstream default native flavor omits FFmpeg's cc_dec caption decoder.
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video
  media_kit_libs_android_video:
    path: third_party/media_kit_libs_android_video

dev_dependencies:
  integration_test:
    sdk: flutter
  test: ^1.26.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/avatars/photos/
    - assets/companion/index.html
    - assets/fonts/OFL.txt
    - assets/sports/stadium_header.jpg
    - assets/branding/tmdb.svg
    - assets/branding/imdb.svg
    - assets/branding/rotten_tomatoes.svg
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
          weight: 400
        - asset: assets/fonts/Roboto.ttf
          weight: 500
        - asset: assets/fonts/Roboto.ttf
          weight: 600
        - asset: assets/fonts/Roboto.ttf
          weight: 700
